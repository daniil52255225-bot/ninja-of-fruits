<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja of Fruits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0f3460, #1a1a2e);
            overflow: hidden;
        }
        
        .fruit {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            transition: transform 0.2s;
        }
        
        .fruit.cut {
            opacity: 0;
            transform: scale(0.5) rotate(360deg);
            transition: all 0.4s ease-out;
        }
        
        .slice-trail {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            height: 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 20;
            box-shadow: 0 0 15px #00ff88;
            transform-origin: 0 0;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 20px;
            z-index: 100;
            text-align: center;
        }
        
        #score {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 20px #00ff88;
            margin-bottom: 10px;
        }
        
        #timer {
            font-size: 24px;
            color: #ff6b6b;
            text-shadow: 0 0 10px #ff6b6b;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        #startButton {
            padding: 20px 40px;
            font-size: 28px;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
        }
        
        h1 {
            font-size: 52px;
            color: #00ff88;
            text-shadow: 0 0 30px #00ff88;
            margin-bottom: 20px;
        }
        
        .instructions {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div id="score">0</div>
            <div id="timer">60</div>
        </div>
        
        <div id="startScreen">
            <h1>🥷 NINJA OF FRUITS 🍉</h1>
            <div class="instructions">
                Режь фрукты свайпами!<br>
                У тебя 60 секунд!<br>
                ⚔️ Проведи пальцем по фрукту
            </div>
            <button id="startButton">НАЧАТЬ ИГРУ!</button>
        </div>
    </div>

    <script>
        class FruitNinjaGame {
            constructor() {
                this.gameContainer = document.getElementById('gameContainer');
                this.scoreElement = document.getElementById('score');
                this.timerElement = document.getElementById('timer');
                this.startScreen = document.getElementById('startScreen');
                this.startButton = document.getElementById('startButton');
                
                this.score = 0;
                this.timeLeft = 60;
                this.gameActive = false;
                this.fruits = [];
                this.slicePoints = [];
                this.lastFruitTime = 0;
                this.fruitInterval = 800;
                
                this.setupEventListeners();
            }
            
            setupEventListeners() {
                this.startButton.addEventListener('click', () => this.startGame());
                
                // Свайп-события
                this.gameContainer.addEventListener('touchstart', (e) => this.handleTouchStart(e));
                this.gameContainer.addEventListener('touchmove', (e) => this.handleTouchMove(e));
                this.gameContainer.addEventListener('touchend', () => this.handleTouchEnd());
                
                // Для ПК
                this.gameContainer.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                this.gameContainer.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                this.gameContainer.addEventListener('mouseup', () => this.handleMouseUp());
            }
            
            startGame() {
                this.startScreen.style.display = 'none';
                this.gameActive = true;
                this.score = 0;
                this.timeLeft = 60;
                this.updateUI();
                
                this.gameLoop();
                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    this.updateUI();
                    if (this.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
            }
            
            endGame() {
                this.gameActive = false;
                clearInterval(this.timerInterval);
                
                // Удаляем все фрукты
                this.fruits.forEach(fruit => fruit.element.remove());
                this.fruits = [];
                
                // Показываем экран окончания
                setTimeout(() => {
                    this.startScreen.style.display = 'flex';
                    this.startButton.textContent = 'ИГРАТЬ СНОВА!';
                    document.querySelector('.instructions').innerHTML = 
                        `Игра окончена!<br>Твой счёт: ${this.score}<br>⚔️ Нажми чтобы играть снова`;
                }, 1000);
            }
            
            handleTouchStart(e) {
                if (!this.gameActive) return;
                this.isSlicing = true;
                this.slicePoints = [];
                this.addSlicePoint(e.touches[0].clientX, e.touches[0].clientY);
            }
            
            handleTouchMove(e) {
                if (!this.gameActive || !this.isSlicing) return;
                this.addSlicePoint(e.touches[0].clientX, e.touches[0].clientY);
                this.drawSliceTrail();
                this.checkSliceCollisions();
            }
            
            handleTouchEnd() {
                this.isSlicing = false;
                this.clearSliceTrail();
            }
            
            handleMouseDown(e) {
                if (!this.gameActive) return;
                this.isSlicing = true;
                this.slicePoints = [];
                this.addSlicePoint(e.clientX, e.clientY);
            }
            
            handleMouseMove(e) {
                if (!this.gameActive || !this.isSlicing) return;
                this.addSlicePoint(e.clientX, e.clientY);
                this.drawSliceTrail();
                this.checkSliceCollisions();
            }
            
            handleMouseUp() {
                this.isSlicing = false;
                this.clearSliceTrail();
            }
            
            addSlicePoint(x, y) {
                this.slicePoints.push({ x, y, time: Date.now() });
                // Держим только последние 10 точек для оптимизации
                if (this.slicePoints.length > 10) {
                    this.slicePoints.shift();
                }
            }
            
            drawSliceTrail() {
                // Удаляем старый след
                this.clearSliceTrail();
                
                // Рисуем линии между точками
                for (let i = 1; i < this.slicePoints.length; i++) {
                    const prev = this.slicePoints[i - 1];
                    const current = this.slicePoints[i];
                    
                    const dx = current.x - prev.x;
                    const dy = current.y - prev.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                    
                    const line = document.createElement('div');
                    line.className = 'slice-trail';
                    line.style.left = prev.x + 'px';
                    line.style.top = prev.y + 'px';
                    line.style.width = distance + 'px';
                    line.style.transform = `rotate(${angle}deg)`;
                    
                    this.gameContainer.appendChild(line);
                    this.sliceTrailElements = this.sliceTrailElements || [];
                    this.sliceTrailElements.push(line);
                }
            }
            
            clearSliceTrail() {
                if (this.sliceTrailElements) {
                    this.sliceTrailElements.forEach(el => el.remove());
                    this.sliceTrailElements = [];
                }
            }
            
            checkSliceCollisions() {
                if (this.slicePoints.length < 2) return;
                
                // Проверяем пересечение с каждым фруктом
                this.fruits.forEach((fruit, index) => {
                    if (fruit.cut || !fruit.element.parentNode) return;
                    
                    const fruitRect = fruit.element.getBoundingClientRect();
                    const fruitCenter = {
                        x: fruitRect.left + fruitRect.width / 2,
                        y: fruitRect.top + fruitRect.height / 2
                    };
                    
                    // Проверяем пересечение линии с фруктом
                    for (let i = 1; i < this.slicePoints.length; i++) {
                        const prev = this.slicePoints[i - 1];
                        const current = this.slicePoints[i];
                        
                        if (this.pointToLineDistance(fruitCenter, prev, current) < fruitRect.width / 2) {
                            this.cutFruit(fruit, index);
                            break;
                        }
                    }
                });
            }
            
            pointToLineDistance(point, lineStart, lineEnd) {
                const A = point.x - lineStart.x;
                const B = point.y - lineStart.y;
                const C = lineEnd.x - lineStart.x;
                const D = lineEnd.y - lineStart.y;
                
                const dot = A * C + B * D;
                const lenSq = C * C + D * D;
                let param = -1;
                
                if (lenSq !== 0) param = dot / lenSq;
                
                let xx, yy;
                
                if (param < 0) {
                    xx = lineStart.x;
                    yy = lineStart.y;
                } else if (param > 1) {
                    xx = lineEnd.x;
                    yy = lineEnd.y;
                } else {
                    xx = lineStart.x + param * C;
                    yy = lineStart.y + param * D;
                }
                
                const dx = point.x - xx;
                const dy = point.y - yy;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            cutFruit(fruit, index) {
                fruit.cut = true;
                fruit.element.classList.add('cut');
                this.score += 10;
                this.updateUI();
                
                setTimeout(() => {
                    if (fruit.element.parentNode) {
                        fruit.element.remove();
                    }
                    this.fruits.splice(index, 1);
                }, 400);
            }
            
            spawnFruit() {
                const fruits = ['🍎', '🍊', '🍉', '🍓', '🍌', '🍑', '🍒'];
                const fruitEmoji = fruits[Math.floor(Math.random() * fruits.length)];
                
                const fruit = document.createElement('div');
                fruit.className = 'fruit';
                fruit.textContent = fruitEmoji;
                fruit.style.fontSize = Math.random() * 30 + 40 + 'px';
                
                // Начальная позиция внизу экрана
                const startX = Math.random() * (window.innerWidth - 100) + 50;
                fruit.style.left = startX + 'px';
                fruit.style.bottom = '-100px';
                
                this.gameContainer.appendChild(fruit);
                
                const fruitObj = {
                    element: fruit,
                    cut: false,
                    startTime: Date.now(),
                    duration: Math.random() * 2000 + 2000, // 2-4 секунды
                    startX: startX,
                    startY: -100,
                    peakY: Math.random() * 200 + 300, // Пиковая высота
                    endY: -150 // Улетает за верх экрана
                };
                
                this.fruits.push(fruitObj);
            }
            
            updateFruits() {
                const now = Date.now();
                
                for (let i = this.fruits.length - 1; i >= 0; i--) {
                    const fruit = this.fruits[i];
                    
                    if (fruit.cut || !fruit.element.parentNode) {
                        this.fruits.splice(i, 1);
                        continue;
                    }
                    
                    const elapsed = now - fruit.startTime;
                    const progress = Math.min(elapsed / fruit.duration, 1);
                    
                    if (progress >= 1) {
                        // Фрукт улетел за экран
                        fruit.element.remove();
                        this.fruits.splice(i, 1);
                    } else {
                        // Параболическое движение: вверх, потом вниз
                        let y;
                        if (progress < 0.5) {
                            // Поднимаемся вверх
                            y = fruit.startY + (fruit.peakY - fruit.startY) * (progress * 2);
                        } else {
                            // Падаем вниз
                            const fallProgress = (progress - 0.5) * 2;
                            y = fruit.peakY + (fruit.endY - fruit.peakY) * fallProgress;
                        }
                        
                        fruit.element.style.bottom = y + 'px';
                    }
                }
            }
            
            gameLoop() {
                if (!this.gameActive) return;
                
                const now = Date.now();
                if (now - this.lastFruitTime > this.fruitInterval) {
                    this.spawnFruit();
                    this.lastFruitTime = now;
                    // Постепенно увеличиваем частоту появления фруктов
                    this.fruitInterval = Math.max(400, this.fruitInterval - 3);
                }
                
                this.updateFruits();
                requestAnimationFrame(() => this.gameLoop());
            }
            
            updateUI() {
                this.scoreElement.textContent = this.score;
                this.timerElement.textContent = this.timeLeft;
            }
        }
        
        // Запуск игры когда страница загрузится
        window.addEventListener('load', () => {
            new FruitNinjaGame();
        });
    </script>
</body>
</html>
